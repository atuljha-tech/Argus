version: '3.8'

services:
  backend:
    build: ./phase5-backend
    container_name: argus-backend
    ports:
      - "8000:8000"
    volumes:
      - ./phase5-backend/models:/app/models
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build: ./phase6-frontend
    container_name: argus-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    restart: unless-stopped
