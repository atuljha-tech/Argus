version: "3.9"

services:
  # ─── Phase 5: FastAPI ML Backend ──────────────────────────────────────────
  backend:
    build:
      context: ./phase5-backend
      dockerfile: Dockerfile
    container_name: argus-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount models directory so you can update models without rebuilding
      - ./phase5-backend/models:/app/models:ro
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Phase 6: Next.js SOC Dashboard Frontend ──────────────────────────────
  frontend:
    build:
      context: ./phase6-frontend
      dockerfile: Dockerfile
    container_name: argus-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Inside Docker network, containers talk to each other by service name
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
      - HOSTNAME=0.0.0.0
      - PORT=3000
    restart: unless-stopped

networks:
  default:
    name: argus-network
