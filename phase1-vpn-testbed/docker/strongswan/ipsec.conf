config setup
    charondebug="ike 2, knl 2, cfg 2"
    uniqueids=no

# Default settings for all connections
conn %default
    ikelifetime=24h
    keylife=1h
    rekeymargin=3m
    keyingtries=1
    keyexchange=ikev2
    authby=secret

# Configuration 1: AES-128-CBC with SHA1 (Weak encryption - for testing)
conn test-vpn-aes128-cbc
    left=192.168.14.1
    leftid=@vpn-server
    leftsubnet=0.0.0.0/0
    right=%any
    rightid=%any
    rightauth=psk
    rightsubnet=0.0.0.0/0
    auto=add
    ike=aes128-cbc-sha1-modp2048!
    esp=aes128-cbc-sha1!
    type=tunnel

# Configuration 2: AES-256-GCM (Strong encryption - modern)
conn test-vpn-aes256-gcm
    left=192.168.14.1
    leftid=@vpn-server
    leftsubnet=0.0.0.0/0
    right=%any
    rightid=%any
    rightauth=psk
    rightsubnet=0.0.0.0/0
    auto=add
    ike=aes256gcm16-prfsha256-modp2048!
    esp=aes256gcm16-esn!
    type=tunnel

# Configuration 3: AES-128-GCM with Perfect Forward Secrecy (PFS)
conn test-vpn-aes128-gcm-pfs
    left=192.168.14.1
    leftid=@vpn-server
    leftsubnet=0.0.0.0/0
    right=%any
    rightid=%any
    rightauth=psk
    rightsubnet=0.0.0.0/0
    auto=add
    ike=aes128gcm16-prfsha256-ecp256!
    esp=aes128gcm16!
    type=tunnel